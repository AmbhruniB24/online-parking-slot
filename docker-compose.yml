version: '3.8'

# [Experiment 10] Deploy full-stack apps using DevOps tools and Docker
services:
  # 1. MongoDB Database Container
  mongo:
    image: mongo:6.0
    container_name: smartpark_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - smartpark_net

  # 2. Node.js + Express + Socket.io Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartpark_backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/parking_db
      - JWT_SECRET=smartpark_super_secret_jwt_key_2026
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongo
    networks:
      - smartpark_net

  # 3. React + Tailwind (Nginx) Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartpark_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - smartpark_net

volumes:
  mongo_data:

networks:
  smartpark_net:
    driver: bridge
